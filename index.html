<div class="header">

  </div>
</div>

<div class="controls">

  </div>
  <div class="view-toggle">
    <button class="view-btn active" id="btn-list" onclick="switchView('list')">List</button>

  </div>
  <div class="event-count" id="event-count"></div>
</div>

<div class="filters-panel">

      <button class="btn-reset" onclick="resetFilters()">Reset</button>
    </div>
    <div class="filter-row">

      <label class="filter-field" for="filter-language">Language<select class="filter-select" id="filter-language" onchange="applyFiltersFromUI()"></select></label>
      <label class="filter-field" for="filter-year">Year<select class="filter-select" id="filter-year" onchange="applyFiltersFromUI()"></select></label>
    </div>
  </div>
</div>

<div class="main">

  <div class="list-view" id="list-view"></div>

    </div>
    <div class="cal-grid" id="cal-grid"></div>
    <div class="tbc-panel" id="tbc-panel"></div>
  </div>
</div>

<div class="event-popup" id="event-popup" onclick="closePopup(event)">
  <div class="popup-card">
    <button class="popup-close" onclick="document.getElementById('event-popup').classList.remove('open')">✕</button>
    <div class="popup-tag" id="p-tag"></div>
    <div class="popup-title" id="p-title"></div>
    <div class="popup-meta" id="p-meta"></div>
    <div class="popup-actions" id="p-actions"></div>
  </div>
</div>

  state.filters.theme = document.getElementById('filter-theme')?.value || '';
  state.filters.language = document.getElementById('filter-language')?.value || '';
  state.filters.year = document.getElementById('filter-year')?.value || '';
  initMonth();
  renderAll();
}
function resetFilters() {
  state.filters = { query:'', type:'', theme:'', language:'', year:'' };
  populateFilters();
  initMonth();
  renderAll();
}
function handleSearchKey(event) { if (event.key === 'Enter') applyFiltersFromUI(); }
function formatDateLong(ev) {
  if (ev.date) {
    const d = parseDate(ev.date);
    let base = `${DAYS[d.getDay()]}, ${d.getDate()} ${MONTHS[d.getMonth()]} ${d.getFullYear()}`;
    if (ev.endDate) {
      const e = parseDate(ev.endDate);
      base = `${d.getDate()} ${MONTHS[d.getMonth()]} ${d.getFullYear()} – ${e.getDate()} ${MONTHS[e.getMonth()]} ${e.getFullYear()}`;
    }
    if (ev.time) return base + ` · ${ev.time}${ev.endTime ? '–' + ev.endTime : ''} ${eventTimeZoneLabel(ev)}`;
    return ev.archive ? base : base + ' · Time TBC';
  }
  if (ev.month) { const [y,m] = ev.month.split('-').map(Number); return `${MONTHS[m-1]} ${y} · Date TBC`; }
  return 'Date to be confirmed';
}
function formatBadge(ev) {
  if (ev.date) { const d = parseDate(ev.date); return `<div class="event-date-badge"><div class="badge-day">${d.getDate()}</div><div class="badge-mon">${MONTHS[d.getMonth()].slice(0,3)}</div></div>`; }
  if (ev.month) { const m = Number(ev.month.slice(5)); return `<div class="event-date-badge"><div class="badge-tbd">TBC</div><div class="badge-mon">${MONTHS[m-1].slice(0,3)}</div></div>`; }
  return `<div class="event-date-badge"><div class="badge-tbd">TBD</div></div>`;
}
function escapeHTML(value) {
  return String(value || '').replace(/[&<>"']/g, character => ({
    '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;'
  })[character]);
}
function eventActions(event, expanded=false) {
  if (event.archive) {
    const links = [];
    if (event.websiteUrl) links.push(`<a class="btn-resource" href="${escapeHTML(event.websiteUrl)}" target="_blank" rel="noopener noreferrer">Website</a>`);
    if (event.youtubeUrl) links.push(`<a class="btn-resource" href="${escapeHTML(event.youtubeUrl)}" target="_blank" rel="noopener noreferrer">Watch on YouTube</a>`);
    return links.join('');
  }
  const hasRegistration = event.registerUrl && event.registerUrl !== '#';
  const hasCalendar = event.date && event.time;
  const registration = hasRegistration
    ? `<a class="btn-register" href="${escapeHTML(event.registerUrl)}" target="_blank" rel="noopener noreferrer">${expanded ? 'Register now' : 'Register'}</a>`
    : '<span class="btn-register disabled">Registration unavailable</span>';
  const calendar = hasCalendar
    ? `<button class="btn-ics" onclick="downloadOneICS(${event.id})">${expanded ? 'Add to calendar' : 'Add to cal'}</button>`
    : `<button class="btn-ics disabled" disabled>${event.date ? 'Time TBC' : 'Date/time TBC'}</button>`;
  const website = event.websiteUrl
    ? `<a class="btn-resource" href="${escapeHTML(event.websiteUrl)}" target="_blank" rel="noopener noreferrer">Website</a>`
    : '';
  return registration + calendar + website;
}
function makeCard(ev) {
  const durationText = ev.duration ? ` · ${ev.duration} min` : '';
  const actions = eventActions(ev);
  const card = document.createElement('div');
  card.className = 'event-card ' + (ev.archive ? 'archive' : '') + (actions ? '' : ' no-actions');
  card.innerHTML = `
    ${formatBadge(ev)}
    <div class="event-body">
      <div class="event-tag-row">
        <div class="event-tag ${ev.archive ? 'archive-tag' : tagClass(ev.tag)}">${escapeHTML(ev.tag || 'Event')}</div>
        ${ev.language ? `<div class="event-lang">${escapeHTML(ev.language)}</div>` : ''}
        ${ev.theme ? `<div class="event-theme">${escapeHTML(ev.theme)}</div>` : ''}
      </div>
      <div class="event-title">${escapeHTML(ev.title)}</div>
      <div class="event-meta">
        <span>📅 ${formatDateLong(ev)}${durationText}</span>
        ${ev.location ? `<span>📍 ${escapeHTML(ev.location)}</span>` : ''}
      </div>
    </div>
    ${actions ? `<div class="event-actions">${actions}</div>` : ''}`;
  return card;
}
function renderList() {
  const container = document.getElementById('list-view'); container.innerHTML = '';
  const data = getDataset();
  if (!data.length) { container.innerHTML = '<div class="empty">No events to show.</div>'; return; }
  const byMonth = {};
  data.forEach(ev => { const k = monthKey(ev); if (!byMonth[k]) byMonth[k] = []; byMonth[k].push(ev); });
  Object.keys(byMonth).sort(compareMonths).forEach(key => {
    const sec = document.createElement('div'); sec.className = 'month-section';
    const label = key !== 'tbd' ? `${MONTHS[Number(key.slice(5))-1]} ${key.slice(0,4)}` : 'Date to be confirmed';
    sec.innerHTML = `<div class="month-label">${label}</div>`;
    byMonth[key].sort(compareEvents).forEach(ev => sec.appendChild(makeCard(ev)));
    container.appendChild(sec);
  });
}
function setNoticeAndCount() {
  const base = getBaseDataset();
  const data = getDataset();
  const dated = data.filter(e=>e.date).length;
  const tbc = data.length - dated;
  const label = state.tab === 'archive' ? 'archived' : 'upcoming';
  const filteredText = data.length === base.length ? `<strong>${data.length}</strong> ${label} events` : `<strong>${data.length}</strong> of ${base.length} ${label} events`;
  document.getElementById('event-count').innerHTML = `${filteredText} · ${dated} dated · ${tbc} TBC`;
  document.getElementById('notice').textContent = state.tab === 'archive'
    ? `Previous activities are shown newest first. Use search and filters to find an event.`
    : `Explore upcoming events and activities with dates to be confirmed. Times are shown in Rome local time (CET/CEST).`;
  document.querySelector('.btn-ics-all').style.display = state.tab === 'upcoming' ? 'inline-flex' : 'none';
}
function initMonth() {
  const data = getDataset().filter(e => e.date || e.month);
  if (data.length) {
    const first = data[0].date || data[0].month + '-01';
    currentYear = Number(first.slice(0,4)); currentMonth = Number(first.slice(5,7)) - 1;
  } else { currentYear = Number(TODAY.slice(0,4)); currentMonth = Number(TODAY.slice(5,7)) - 1; }
}
function renderGrid() {
  document.getElementById('cal-title').textContent = `${MONTHS[currentMonth]} ${currentYear}`;
  const grid = document.getElementById('cal-grid');
  const today = parseDate(TODAY);
  const firstDay = new Date(currentYear, currentMonth, 1).getDay();
  const daysInMonth = new Date(currentYear, currentMonth+1, 0).getDate();
  const daysInPrev = new Date(currentYear, currentMonth, 0).getDate();
  const evMap = {};
  getDataset().filter(e=>e.date).forEach(ev => {
    const start = parseDate(ev.date), end = parseDate(ev.endDate || ev.date);
    for (let day = new Date(start); day <= end; day.setDate(day.getDate()+1)) {
      if (day.getFullYear() === currentYear && day.getMonth() === currentMonth) {
        const key = day.getDate(); if (!evMap[key]) evMap[key] = []; evMap[key].push(ev);
      }
    }
  });
  let html = `<div class="cal-weekdays">${DAYS.map(d=>`<div class="cal-wd">${d}</div>`).join('')}</div><div class="cal-days">`;
  for (let i=firstDay-1;i>=0;i--) html += `<div class="cal-day other-month"><div class="day-num">${daysInPrev-i}</div></div>`;
  for (let d=1; d<=daysInMonth; d++) {
    const isToday = today.getDate()===d && today.getMonth()===currentMonth && today.getFullYear()===currentYear;
    const evs = evMap[d] || [];
    html += `<div class="cal-day ${isToday?'today':''}"><div class="day-num">${d}</div>${evs.map(ev=>`<div class="cal-event-pill ${ev.archive?'archive':''}" onclick="openPopup(${ev.id})" title="${ev.title.replace(/"/g,'&quot;')}">${ev.title.substring(0,30)}…</div>`).join('')}</div>`;
  }
  const total = firstDay + daysInMonth; const remaining = total % 7 === 0 ? 0 : 7 - (total % 7);
  for (let d=1; d<=remaining; d++) html += `<div class="cal-day other-month"><div class="day-num">${d}</div></div>`;
  html += '</div>'; grid.innerHTML = html;
  renderTBCPanel();
}
function renderTBCPanel() {
  const panel = document.getElementById('tbc-panel');
  const key = `${currentYear}-${String(currentMonth+1).padStart(2,'0')}`;
  const tbc = getDataset().filter(e=>!e.date && e.month === key);
  if (!tbc.length) { panel.style.display='none'; panel.innerHTML=''; return; }
  panel.style.display='block';
  panel.innerHTML = `<div class="tbc-panel-title">Date TBC in ${MONTHS[currentMonth]} ${currentYear}</div>` + tbc.map(e=>`<span class="tbc-chip">${e.title}</span>`).join('');
}
function openPopup(id) {
  const ev = EVENTS.find(e=>e.id===id); if(!ev) return;
  document.getElementById('p-tag').textContent = ev.tag || 'Event';
  document.getElementById('p-title').textContent = ev.title;
  document.getElementById('p-meta').innerHTML = `
    <span>📅 ${formatDateLong(ev)}${ev.duration ? ' · ' + ev.duration + ' min' : ''}</span>
    ${ev.location ? `<span>📍 ${ev.location}</span>` : ''}
    ${ev.language ? `<span>🗣 ${ev.language}</span>` : ''}
    ${ev.theme ? `<span>🏷 ${ev.theme}</span>` : ''}
  `;
  document.getElementById('p-actions').innerHTML = eventActions(ev, true);
  document.getElementById('event-popup').classList.add('open');
}
function closePopup(e) { if (e.target === document.getElementById('event-popup')) document.getElementById('event-popup').classList.remove('open'); }
function switchTab(tab) {
  state.tab = tab; document.getElementById('tab-upcoming').classList.toggle('active', tab==='upcoming'); document.getElementById('tab-archive').classList.toggle('active', tab==='archive');
  populateFilters(); initMonth(); renderAll();
}
function switchView(view) {
  state.view = view;
  document.getElementById('list-view').style.display = view==='list' ? 'block' : 'none';
  document.getElementById('grid-view').style.display = view==='grid' ? 'block' : 'none';
  document.getElementById('btn-list').classList.toggle('active', view==='list');
  document.getElementById('btn-grid').classList.toggle('active', view==='grid');
  renderAll();
}
function changeMonth(delta) { currentMonth += delta; if(currentMonth<0){currentMonth=11; currentYear--;} if(currentMonth>11){currentMonth=0; currentYear++;} renderGrid(); }
function renderAll() { setNoticeAndCount(); if(state.view==='list') renderList(); else renderGrid(); }

function escapeICS(text) {
  return String(text || '').replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\n/g,'\\n');
}
function toICSDate(dateStr, timeStr, addMinutes=0, timeZone='Europe/Rome') {
  const [year, month, day] = dateStr.split('-').map(Number);
  const [hour, minute] = timeStr.split(':').map(Number);
  const localTime = Date.UTC(year, month-1, day, hour, minute, 0);
  const formatter = new Intl.DateTimeFormat('en-GB', {
    timeZone, year:'numeric', month:'2-digit', day:'2-digit',
    hour:'2-digit', minute:'2-digit', second:'2-digit', hourCycle:'h23'
  });
  let instant = localTime;
  for (let pass=0; pass<2; pass++) {
    const parts = Object.fromEntries(formatter.formatToParts(new Date(instant))
      .filter(part => part.type !== 'literal').map(part => [part.type, Number(part.value)]));
    const represented = Date.UTC(parts.year, parts.month-1, parts.day, parts.hour, parts.minute, parts.second);
    instant = localTime - (represented - instant);
  }
  return new Date(instant + addMinutes * 60000).toISOString().replace(/[-:]/g,'').split('.')[0] + 'Z';
}
function eventTimeZoneLabel(event) {
  const utc = toICSDate(event.date, event.time || '12:00', 0, event.timeZone || 'Europe/Rome');
  const instant = new Date(`${utc.slice(0,4)}-${utc.slice(4,6)}-${utc.slice(6,8)}T${utc.slice(9,11)}:${utc.slice(11,13)}:${utc.slice(13,15)}Z`);
  return new Intl.DateTimeFormat('en-GB', { timeZone:event.timeZone || 'Europe/Rome', timeZoneName:'short' })
    .formatToParts(instant).find(part => part.type === 'timeZoneName').value;
}
function foldICSLine(line) {
  const encoder = new TextEncoder();
  const folded = [];
  let current = '', bytes = 0;
  for (const character of line) {
    const size = encoder.encode(character).length;
    if (bytes + size > 75) { folded.push(current); current = ' '; bytes = 1; }
    current += character; bytes += size;
  }
  folded.push(current);
  return folded.join('\r\n');
}
function makeICS(events) {
  const stamp = new Date().toISOString().replace(/[-:]/g,'').split('.')[0] + 'Z';
  const lines = ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Agri-PDB Platform//Events Calendar//EN','CALSCALE:GREGORIAN','METHOD:PUBLISH','X-WR-CALNAME:Agri-PDB Upcoming Events','X-WR-TIMEZONE:Europe/Rome'];
  events.filter(e=>e.date && e.time && !e.archive).forEach(e => {
    const zone = e.timeZone || 'Europe/Rome';
    const start = toICSDate(e.date, e.time, 0, zone);
    const uid = `agripdb-${e.id}-${e.date}@agri-pdb.org`;
    lines.push('BEGIN:VEVENT', `UID:${uid}`, `DTSTAMP:${stamp}`, `DTSTART:${start}`);
    // Leave the end time unspecified unless it was supplied or is already known.
    if (e.endTime) lines.push(`DTEND:${toICSDate(e.endDate || e.date, e.endTime, 0, zone)}`);
    else if (e.duration) lines.push(`DTEND:${toICSDate(e.date, e.time, e.duration, zone)}`);
    lines.push(`SUMMARY:${escapeICS(e.title)}`, `LOCATION:${escapeICS(e.location || '')}`,
      e.registerUrl ? `URL:${e.registerUrl}` : '',
      'ORGANIZER;CN=Agri-PDB Platform:mailto:info@agri-pdb.org', 'END:VEVENT');
  });
  lines.push('END:VCALENDAR');
  return lines.filter(Boolean).map(foldICSLine).join('\r\n') + '\r\n';
}
function downloadICS(events, filename) { const blob = new Blob([makeICS(events)], {type:'text/calendar;charset=utf-8'}); const url=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=url; a.download=filename; a.click(); URL.revokeObjectURL(url); }
function downloadCurrentICS() { downloadICS(EVENTS.filter(e=>!e.archive), 'agri-pdb-upcoming-events.ics'); }
function downloadOneICS(id) { const ev = EVENTS.find(e=>e.id===id); if(ev && ev.date && ev.time && !ev.archive) downloadICS([ev], `agri-pdb-event-${id}.ics`); }

populateFilters(); initMonth(); renderAll();
</script>
